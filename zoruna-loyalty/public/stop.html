<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إيقاف الرسائل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
  <section class="card">
    <h2>إيقاف الرسائل النصية</h2>
    <p class="muted">إذا تريد ما توصلك رسائل منّا بعد، اضغط الزر. بطاقة الولاء وأختامك تبقى مثل ما هي.</p>
    <button id="b" class="btn">أوقف الرسائل</button>
    <p id="msg" class="msg" role="status"></p>
  </section>
</main>
<script>
document.getElementById('b').onclick = async (e) => {
  e.target.disabled = true;
  const r = await fetch(`/api/stop/${encodeURIComponent(location.pathname.split('/').pop())}`, { method: 'POST' });
  const m = document.getElementById('msg');
  m.className = r.ok ? 'msg ok' : 'msg err';
  m.textContent = r.ok ? 'تم. ما راح نزعجك برسائل بعد، وتبقى عزيز علينا 🌴' : 'الرابط غير صحيح';
};
</script>
</body>
</html>
