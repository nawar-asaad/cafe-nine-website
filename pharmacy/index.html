<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيدلية الرحمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* التخطيط: شريط جانبي أخضر زاهٍ على اليمين + مساحة عمل فاتحة، بطاقات ملونة للمؤشرات */
:root{
  --bg:#eef6f7;
  --surface:#ffffff;
  --surface-2:#f6fafb;
  --ink:#12303a;
  --muted:#5d7883;
  --line:#dce9ed;
  --brand:#0fb58a;
  --brand-2:#0a8a9c;
  --brand-soft:#dcf7ee;
  --coral:#ff5f6d;
  --violet:#7b5cff;
  --amber:#ffab1a;
  --sky:#1fa8ff;
  --pink:#ff4f9a;
  --ok:#12a150;
  --warn:#e08a00;
  --bad:#e0344a;
  --font-display:"Cairo","Tajawal",Tahoma,"Segoe UI",sans-serif;
  --font-body:"Tajawal","Cairo",Tahoma,"Segoe UI",sans-serif;
  --radius:14px;
  --shadow:0 6px 20px rgba(10,80,90,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
.num,td.n,.tabular{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ===== الهيكل ===== */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{background:linear-gradient(170deg,#087c8c 0%,#0fb58a 70%,#43d19e 100%);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:12px;padding:6px 8px}
.logo .cross{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.logo h1{font-size:20px;font-weight:800}
.logo small{display:block;opacity:.85;font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#fff;padding:11px 14px;border-radius:12px;cursor:pointer;text-align:right;font-weight:600;font-family:var(--font-display);font-size:15px;transition:background .15s}
.nav button svg{flex:none;opacity:.95}
.nav button:hover{background:rgba(255,255,255,.16)}
.nav button.active{background:#fff;color:var(--brand-2);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.nav kbd{margin-inline-start:auto;font-size:11px;background:rgba(255,255,255,.25);border-radius:6px;padding:0 6px;font-family:var(--font-body)}
.nav button.active kbd{background:var(--brand-soft)}
.side-foot{margin-top:auto;font-size:12px;opacity:.85;padding:0 8px}
.main{padding:22px 26px 40px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar h2{font-size:24px;font-weight:800}
.topbar .sub{color:var(--muted);font-size:14px}
.clock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;color:var(--muted);font-size:14px}

/* ===== عناصر عامة ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{border:0;border-radius:11px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:14px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
.btn.violet{background:var(--violet);color:#fff;border-color:transparent}
.btn.coral{background:var(--coral);color:#fff;border-color:transparent}
.btn.amber{background:var(--amber);color:#3a2600;border-color:transparent}
.btn.sky{background:var(--sky);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.big{padding:14px 22px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--brand-2);border-color:var(--brand)}
.iconbtn.del:hover{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--sky) 60%,transparent);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
input.i,select.i,textarea.i{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%;color:var(--ink);font-size:15px;font-weight:500}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
.search{position:relative;flex:1;min-width:200px}
.search input{padding-inline-start:38px}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:#dff6e8;color:var(--ok)}
.pill.warn{background:#fff1d6;color:#a86400}
.pill.bad{background:#ffe0e5;color:var(--bad)}
.pill.info{background:#e0f1ff;color:#0a6fb3}
.pill.none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;background:var(--surface);font-size:14px}
table.t th{background:var(--surface-2);color:var(--muted);font-weight:700;text-align:right;padding:10px 12px;white-space:nowrap;font-family:var(--font-display);font-size:13px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:#f3fbf8}
table.t td.n{white-space:nowrap}
.pname{font-weight:700}
.psci{font-size:12.5px;color:var(--muted)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;direction:ltr;unicode-bidi:embed;letter-spacing:.5px}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* ===== بطاقات المؤشرات ===== */
.kpi{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;min-height:120px;display:flex;flex-direction:column;gap:4px;box-shadow:0 10px 24px rgba(0,0,0,.08)}
.kpi::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);inset-inline-end:-40px;bottom:-60px}
.kpi .lbl{font-size:14px;font-weight:700;opacity:.95;font-family:var(--font-display)}
.kpi .val{font-size:28px;font-weight:800;font-family:var(--font-display);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .hint{font-size:13px;opacity:.92}
.kpi.k1{background:linear-gradient(135deg,#12c28f,#0a8a9c)}
.kpi.k2{background:linear-gradient(135deg,#8a6bff,#5b3fe0)}
.kpi.k3{background:linear-gradient(135deg,#ff8a3d,#ff4f6d)}
.kpi.k4{background:linear-gradient(135deg,#1fb5ff,#1570e0)}
.kpi.k5{background:linear-gradient(135deg,#ff5fa2,#d93b82)}
.kpi.k6{background:linear-gradient(135deg,#ffc53d,#ff9500);color:#3a2600}

.alert-tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:right;width:100%}
.alert-tile:hover{border-color:var(--brand)}
.alert-tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.alert-tile b{font-size:22px;font-family:var(--font-display);display:block;line-height:1.1}
.alert-tile span{font-size:13px;color:var(--muted)}

.chart-box{position:relative;width:100%;height:260px}
.chart-box canvas{width:100%;height:100%;display:block}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .v{margin-inline-start:auto;font-weight:700;font-variant-numeric:tabular-nums}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted);font-family:var(--font-display);font-size:14px}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}

/* ===== نقطة البيع ===== */
.pos{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.scan{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#0fb58a,#0a8a9c);padding:14px;border-radius:16px;color:#fff}
.scan input{flex:1;border:0;border-radius:11px;padding:12px 14px;font-size:17px;font-weight:600;min-width:0;color:var(--ink);background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:transparent;color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;min-width:0}
.tile::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--c,var(--brand))}
.tile:hover{border-color:var(--c,var(--brand));transform:translateY(-1px)}
.tile .nm{font-weight:800;font-family:var(--font-display);font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.tile .pr{color:var(--brand-2);font-weight:800;font-variant-numeric:tabular-nums}
.tile .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tile.out{opacity:.5}
.cart{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.cart-items{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.ci .nm{font-weight:700;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.qty button{border:0;background:transparent;width:30px;height:32px;cursor:pointer;font-size:18px;font-weight:800;color:var(--brand-2)}
.qty input{width:44px;border:0;text-align:center;font-weight:800;background:transparent;font-variant-numeric:tabular-nums}
.totals{display:flex;flex-direction:column;gap:6px;font-size:15px}
.totals div{display:flex;justify-content:space-between;gap:8px}
.totals .grand{font-size:24px;font-weight:800;font-family:var(--font-display);color:var(--brand-2);border-top:2px dashed var(--line);padding-top:8px}

/* ===== الرفوف ===== */
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.shelf{border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow);text-align:right;padding:0}
.shelf:hover{border-color:var(--brand)}
.shelf .hd{padding:14px;color:#fff;display:flex;align-items:center;gap:12px}
.shelf .no{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:24px;font-weight:800;font-family:var(--font-display);flex:none}
.shelf .hd b{font-family:var(--font-display);font-size:16px;display:block}
.shelf .bd{padding:12px 14px;display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted)}
.shelf .bd strong{color:var(--ink);font-size:16px;display:block}
.shelf-boards{display:flex;flex-direction:column;gap:3px;padding:0 14px 12px}
.shelf-boards i{display:block;height:6px;border-radius:3px;background:var(--line)}

/* ===== الباركود ===== */
.bc{direction:ltr;display:inline-block;background:#fff;padding:4px;border-radius:6px}
.bc svg{display:block;max-width:100%;height:auto}
.labels-preview{display:flex;flex-wrap:wrap;gap:10px;padding:14px;background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 10px,var(--bg) 10px,var(--bg) 20px);border-radius:12px;border:1px solid var(--line);max-height:520px;overflow:auto}
.lbl-card{background:#fff;color:#000;border:1px dashed #9bb;border-radius:4px;padding:2mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;overflow:hidden}
.lbl-card .ph{font-size:8px;font-weight:700}
.lbl-card .pn{font-size:10px;font-weight:800;line-height:1.15;max-height:2.3em;overflow:hidden}
.lbl-card .pp{font-size:10px;font-weight:800}
.lbl-card svg{width:100%;height:auto}
.lbl-card.s{width:38mm;height:25mm}
.lbl-card.m{width:50mm;height:30mm}
.lbl-card.l{width:60mm;height:40mm}

/* ===== النوافذ ===== */
.overlay{position:fixed;inset:0;background:rgba(8,40,48,.45);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:18px;width:min(720px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.sm{width:min(440px,100%)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mh h3{font-size:18px}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;gap:8px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.toasts{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.2);font-weight:600;animation:tin .2s ease-out}
.toast.ok{background:var(--ok)}
.toast.bad{background:var(--bad)}
@keyframes tin{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== الفاتورة ===== */
.receipt{width:80mm;max-width:100%;margin:0 auto;background:#fff;color:#000;padding:10px 12px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;font-family:var(--font-body)}
.receipt h2{text-align:center;font-size:18px}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #555;margin:6px 0}
.receipt table{width:100%;border-collapse:collapse}
.receipt th,.receipt td{padding:3px 2px;text-align:right;font-size:12px}
.receipt th{border-bottom:1px solid #000}
.receipt .tot{display:flex;justify-content:space-between;font-weight:700}
.receipt .big{font-size:15px}
.void-stamp{color:var(--bad);border:2px solid var(--bad);display:inline-block;padding:0 10px;border-radius:6px;font-weight:800;transform:rotate(-6deg)}

#printArea{display:none}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.pos{grid-template-columns:minmax(0,1fr)}.cart{position:static}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:10px;z-index:20;overflow:visible}
  .logo{padding:0}.logo .cross{width:38px;height:38px}.logo h1{font-size:16px}.logo small{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  .nav button{padding:8px 12px;white-space:nowrap;font-size:14px}
  .nav kbd,.side-foot{display:none}
  .main{padding:16px 16px 40px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .g4{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .nav button span{display:none}
  .kpi .val{font-size:24px}
}

@media print{
  body{background:#fff}
  .app,.overlay,.toasts{display:none!important}
  #printArea{display:block}
  #printArea.receipt-mode .receipt{border:0;width:76mm;padding:0}
  #printArea.labels-mode{display:flex;flex-wrap:wrap;gap:0}
  #printArea.labels-mode .lbl-card{border:0;page-break-inside:avoid}
  #printArea.report-mode{font-size:12px}
  #printArea.report-mode table{width:100%;border-collapse:collapse}
  #printArea.report-mode th,#printArea.report-mode td{border:1px solid #999;padding:4px 6px;text-align:right}
  @page{margin:6mm}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="cross">
        <svg width="28" height="28" viewBox="0 0 24 24"><path fill="#0fb58a" d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/><path fill="#fff" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z" opacity=".35"/></svg>
      </div>
      <div><h1 id="brandName">صيدلية الرحمة</h1><small>نظام الإدارة المحاسبية والمخزنية</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">البيانات محفوظة على هذا الجهاز.<br>خذ نسخة احتياطية بانتظام من الإعدادات.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h2 id="pageTitle">لوحة التحكم</h2><div class="sub" id="pageSub"></div></div>
      <div class="clock num" id="clock"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>
<div id="printArea"></div>

<script>
"use strict";
/* ============================================================
   أدوات عامة
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const eod = d => { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DAY = 864e5;
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmtN = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const money = n => fmtN(n) + ' ' + (DB.settings.currency || '');

function code128Pattern(text) {

  const W = x + quiet, H = height + (label ? fontSize + 4 : 0);

}

  inv.forEach(i => {
    total += i.total; discount += i.discount || 0;
    const k = ymd(new Date(i.date)); const bd = byDay.get(k) || { total: 0, count: 0 }; bd.total += i.total; bd.count++; byDay.set(k, bd);
    i.items.forEach(x => {
      cost += x.qty * x.cost; units += x.qty;
      const e = byProduct.get(x.pid) || { qty: 0, rev: 0, cost: 0, name: x.name }; e.qty += x.qty; e.rev += x.qty * x.price; e.cost += x.qty * x.cost; byProduct.set(x.pid, e);
      const p = prodById(x.pid); const cid = p ? p.categoryId : ''; byCat.set(cid, (byCat.get(cid) || 0) + x.qty * x.price);
    });
  });
  return { inv, total, cost, profit: total - cost, units, discount, byProduct, byDay, byCat, avg: inv.length ? total / inv.length : 0 };
}
function lastSaleMap() { const m = new Map(); DB.invoices.forEach(i => { if (i.status === 'void') return; i.items.forEach(x => { const d = new Date(i.date); if (!m.has(x.pid) || m.get(x.pid) < d) m.set(x.pid, d); }); }); return m; }
function periodRange(kind, f, t) {
  const now = new Date(), today = sod(now);
  switch (kind) {
    case 'today': return { from: today, to: eod(now), label: 'اليوم ' + fmtDate(today) };
    case 'yesterday': return { from: addDays(today, -1), to: eod(addDays(today, -1)), label: 'أمس' };
    case 'week': return { from: addDays(today, -6), to: eod(now), label: 'آخر 7 أيام' };
    case 'month': return { from: addDays(today, -29), to: eod(now), label: 'آخر 30 يوماً' };
    case 'thismonth': return { from: new Date(now.getFullYear(), now.getMonth(), 1), to: eod(now), label: 'الشهر الحالي: ' + AR_MONTHS[now.getMonth()] };
    default: { const a = f ? sod(new Date(f)) : addDays(today, -6), b = t ? eod(new Date(t)) : eod(now); return { from: a, to: b, label: `من ${ymd(a)} إلى ${ymd(b)}` }; }
  }
}

/* ============================================================
   رسوم بيانية على Canvas
   ============================================================ */
function barChart(cv, labels, values, { c1 = '#12c28f', c2 = '#0a8a9c', fmt = shortN, highlightLast = true } = {}) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr); c.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement);
  const muted = css.getPropertyValue('--muted').trim(), line = css.getPropertyValue('--line').trim(), ink = css.getPropertyValue('--ink').trim();
  const pl = 48, pr = 10, pt = 22, pb = 30, n = values.length, cw = W - pl - pr, ch = H - pt - pb;
  const raw = Math.max(1, ...values); const mag = Math.pow(10, Math.floor(Math.log10(raw))); const max = Math.ceil(raw / mag * 2) / 2 * mag;
  c.font = '12px Tajawal, Tahoma, sans-serif'; c.textBaseline = 'middle'; c.direction = 'ltr';
  for (let i = 0; i <= 4; i++) {
    const y = pt + ch - ch * i / 4; c.strokeStyle = line; c.lineWidth = 1; c.beginPath(); c.moveTo(pl, y); c.lineTo(W - pr, y); c.stroke();
    c.fillStyle = muted; c.textAlign = 'right'; c.fillText(fmt(max * i / 4), pl - 8, y);
  }
  const slot = cw / n, bw = Math.max(3, Math.min(42, slot * .62)); const rects = [];
  const every = Math.ceil(n / Math.max(1, Math.floor(cw / 46)));
  values.forEach((v, i) => {
    const h = ch * v / max, x = pl + slot * i + (slot - bw) / 2, y = pt + ch - h;
    const g = c.createLinearGradient(0, y, 0, pt + ch); g.addColorStop(0, c1); g.addColorStop(1, c2);
    c.fillStyle = (highlightLast && i === n - 1) ? '#ff5f6d' : g;
    const r = Math.min(6, bw / 2, h);
    c.beginPath(); c.moveTo(x, pt + ch); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.lineTo(x + bw - r, y); c.quadraticCurveTo(x + bw, y, x + bw, y + r); c.lineTo(x + bw, pt + ch); c.closePath(); c.fill();
    rects.push({ x, w: bw, v, l: labels[i] });
    if (n <= 16 && v > 0) { c.fillStyle = ink; c.textAlign = 'center'; c.font = 'bold 11px Tajawal, Tahoma, sans-serif'; c.fillText(fmt(v), x + bw / 2, y - 9); c.font = '12px Tajawal, Tahoma, sans-serif'; }
    if (i % every === 0 || i === n - 1) { c.fillStyle = muted; c.textAlign = 'center'; c.fillText(labels[i], x + bw / 2, H - pb / 2 + 2); }
  });
  cv.onmousemove = e => { const bx = e.offsetX; const hit = rects.find(r => bx >= r.x - 3 && bx <= r.x + r.w + 3); cv.title = hit ? `${hit.l}: ${fmtN(hit.v)} ${DB.settings.currency}` : ''; };
}
function donut(cv, parts) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr); c.clearRect(0, 0, W, H);
  const total = parts.reduce((s, p) => s + p.v, 0) || 1, R = Math.min(W, H) / 2 - 6, cx = W / 2, cy = H / 2; let a = -Math.PI / 2;
  parts.forEach(p => { const da = p.v / total * Math.PI * 2; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R, a, a + da); c.closePath(); c.fillStyle = p.c; c.fill(); a += da; });
  c.beginPath(); c.arc(cx, cy, R * .58, 0, Math.PI * 2); c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim(); c.fill();
  c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.direction = 'ltr';
  c.font = 'bold 18px Cairo, Tahoma, sans-serif'; c.fillText(shortN(total), cx, cy - 6); c.font = '12px Tajawal, Tahoma, sans-serif'; c.fillText(DB.settings.currency, cx, cy + 14);
}

function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200); }
function openModal(title, body, footer = '', size = '') {
  const root = document.createElement('div'); root.className = 'overlay';
  root.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true"><div class="mh"><h3>${title}</h3><button class="iconbtn" data-close aria-label="إغلاق">${ic('close', 18)}</button></div><div class="mb">${body}</div>${footer ? `<div class="mf">${footer}</div>` : ''}</div>`;
  const close = () => root.remove();
  root.addEventListener('click', e => { if (e.target === root || e.target.closest('[data-close]')) close(); });
  $('#modalRoot').appendChild(root);
  setTimeout(() => { const f = root.querySelector('[autofocus]') || root.querySelector('input,select'); f && f.focus(); }, 30);
  return { root, close };
}
function askConfirm(msg, onYes, yesLabel = 'نعم، متابعة') {
  const m = openModal('تأكيد', `<p style="margin:0;font-size:16px">${msg}</p>`, `<button class="btn coral" data-yes>${yesLabel}</button><button class="btn" data-close>إلغاء</button>`, 'sm');
  m.root.querySelector('[data-yes]').onclick = () => { m.close(); onYes(); };
}
function doPrint(html, mode) { const pa = $('#printArea'); pa.className = mode; pa.innerHTML = html; setTimeout(() => window.print(), 50); }
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV(name, headers, rows) {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  downloadFile(name, '﻿' + [headers, ...rows].map(r => r.map(q).join(',')).join('\n'), 'text/csv;charset=utf-8');
}

function addToCart(pid) {

}

}

const REPORT_TABS = {

  dispensed(a) {

      title: 'الكميات المصروفة',

      csv: [['المادة', 'القسم', 'الرف', 'الكمية المصروفة', 'قيمة المبيعات', 'الربح', 'المتبقي'], rows.map(x => [x.name, catById(x.p?.categoryId)?.name || '', x.p ? shelfById(x.p.shelfId)?.number ?? '' : '', x.qty, x.rev, x.rev - x.cost, x.p?.qty ?? ''])]
    };
  },
  idle(a, r) {
    const last = lastSaleMap();
    const rows = DB.products.filter(p => !a.byProduct.has(p.id)).map(p => ({ p, last: last.get(p.id) })).sort((x, y) => (x.last || 0) - (y.last || 0));
    const tied = rows.reduce((s, x) => s + Math.max(0, x.p.qty) * x.p.buy, 0);
    return {
      title: 'المواد غير المصروفة',
      html: `<div class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0">${ic('sleep')} مواد لم تُصرف خلال: ${r.label}</h3><span class="spacer"></span><span class="pill warn">${rows.length} مادة</span><span class="pill bad num">رأس مال مجمّد ${money(tied)}</span></div>${rows.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>المادة</th><th>القسم</th><th>الرف</th><th>الكمية في المخزون</th><th>قيمتها (شراء)</th><th>آخر بيع</th><th>الصلاحية</th></tr></thead><tbody>${rows.map(x => `<tr><td><div class="pname">${esc(x.p.name)}</div><div class="psci">${esc(x.p.sci || '')}</div></td><td>${catPill(x.p.categoryId)}</td><td class="n">${shelfLabel(shelfById(x.p.shelfId))}</td><td class="n">${stockPill(x.p)}</td><td class="n num">${money(Math.max(0, x.p.qty) * x.p.buy)}</td><td class="n">${x.last ? `<span class="num">${ymd(x.last)}</span> <span class="small muted">(منذ ${Math.round((Date.now() - x.last) / DAY)} يوم)</span>` : '<span class="pill bad">لم تُبع أبداً</span>'}</td><td class="n">${expPill(x.p)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">كل المواد صُرفت في هذه الفترة.</div>'}</div>`,
      csv: [['المادة', 'القسم', 'الرف', 'الكمية', 'القيمة بسعر الشراء', 'آخر بيع', 'تاريخ الانتهاء'], rows.map(x => [x.p.name, catById(x.p.categoryId)?.name || '', shelfById(x.p.shelfId)?.number ?? '', x.p.qty, Math.max(0, x.p.qty) * x.p.buy, x.last ? ymd(x.last) : 'لم تُبع', x.p.expiry])]
    };
  },
  stock() {
    const byCat = DB.categories.map(c => { const ps = DB.products.filter(p => p.categoryId === c.id); return { c, n: ps.length, q: ps.reduce((s, p) => s + Math.max(0, p.qty), 0), cost: ps.reduce((s, p) => s + Math.max(0, p.qty) * p.buy, 0), sale: ps.reduce((s, p) => s + Math.max(0, p.qty) * p.sell, 0), low: ps.filter(p => stockState(p) !== 'ok').length }; });
    const T = byCat.reduce((s, x) => ({ n: s.n + x.n, q: s.q + x.q, cost: s.cost + x.cost, sale: s.sale + x.sale, low: s.low + x.low }), { n: 0, q: 0, cost: 0, sale: 0, low: 0 });
    const low = DB.products.filter(p => stockState(p) !== 'ok').sort((a, b) => a.qty - b.qty);
    const exp = DB.products.filter(p => ['soon', 'expired'].includes(expState(p))).sort((a, b) => daysToExpiry(a) - daysToExpiry(b));
    return {
      title: 'المخزون',
      html: `<div class="grid g3" style="margin-bottom:16px">
          <div class="card"><div class="muted small">قيمة المخزون بسعر الشراء</div><div class="num" style="font-size:24px;font-weight:800;font-family:var(--font-display)">${money(T.cost)}</div></div>
          <div class="card"><div class="muted small">قيمة المخزون بسعر البيع</div><div class="num" style="font-size:24px;font-weight:800;font-family:var(--font-display);color:var(--brand-2)">${money(T.sale)}</div></div>
          <div class="card"><div class="muted small">الربح المتوقع عند بيع كامل المخزون</div><div class="num" style="font-size:24px;font-weight:800;font-family:var(--font-display);color:var(--ok)">${money(T.sale - T.cost)}</div></div>
        </div>
        <div class="card"><h3>المخزون حسب القسم العلاجي</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>القسم</th><th>عدد الأصناف</th><th>عدد القطع</th><th>القيمة (شراء)</th><th>القيمة (بيع)</th><th>ناقصة</th></tr></thead><tbody>${byCat.map(x => `<tr><td>${catPill(x.c.id)}</td><td class="n num">${x.n}</td><td class="n num">${fmtN(x.q)}</td><td class="n num">${money(x.cost)}</td><td class="n num">${money(x.sale)}</td><td class="n">${x.low ? `<span class="pill bad num">${x.low}</span>` : '<span class="pill ok">0</span>'}</td></tr>`).join('')}<tr style="background:var(--surface-2);font-weight:800"><td>المجموع</td><td class="n num">${T.n}</td><td class="n num">${fmtN(T.q)}</td><td class="n num">${money(T.cost)}</td><td class="n num">${money(T.sale)}</td><td class="n num">${T.low}</td></tr></tbody></table></div></div>
        <div class="grid g2" style="margin-top:16px"><div class="card"><h3>${ic('alert')} مواد تحتاج إعادة طلب</h3>${alertTable(low, 'stock')}</div><div class="card"><h3>${ic('clock')} مواد قاربت أو انتهت صلاحيتها</h3>${alertTable(exp, 'exp')}</div></div>`,
      csv: [['المادة', 'الباركود', 'القسم', 'الرف', 'الكمية', 'الحد الأدنى', 'سعر الشراء', 'سعر البيع', 'القيمة (شراء)', 'القيمة (بيع)', 'تاريخ الانتهاء', 'الحالة'], DB.products.slice().sort((a, b) => (shelfById(a.shelfId)?.number ?? 999) - (shelfById(b.shelfId)?.number ?? 999)).map(p => [p.name, p.barcode, catById(p.categoryId)?.name || '', shelfById(p.shelfId)?.number ?? '', p.qty, p.minQty, p.buy, p.sell, Math.max(0, p.qty) * p.buy, Math.max(0, p.qty) * p.sell, p.expiry, { ok: 'متوفر', low: 'ناقص', out: 'نافد' }[stockState(p)]])]
    };
  }
};

let wedge = '', wedgeT = 0;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const o = $$('.overlay').pop(); if (o) { o.remove(); return; } }
  const map = { F1: 'dashboard', F2: 'pos', F3: 'products', F4: 'invoices', F6: 'reports' };
  if (map[e.key] && !$('.overlay')) { e.preventDefault(); go(map[e.key]); if (e.key === 'F2') setTimeout(() => $('#scanInput')?.focus(), 30); return; }
  if (e.key === 'F9' && current === 'pos' && !$('.overlay')) { e.preventDefault(); checkout(); return; }
  // قارئ باركود يكتب بسرعة خارج الحقول: في نقطة البيع يضيف المادة مباشرة
  const tag = (e.target.tagName || '').toLowerCase();
  if (current !== 'pos' || $('.overlay') || ['input', 'textarea', 'select'].includes(tag)) return;
  const now = Date.now(); if (now - wedgeT > 80) wedge = ''; wedgeT = now;
  if (e.key === 'Enter') { if (wedge.length >= 4) { e.preventDefault(); handleScan(wedge); } wedge = ''; }
  else if (e.key.length === 1) wedge += e.key;
});

/* ============================================================
   التشغيل
   ============================================================ */
load(); applyBrand(); tickClock(); setInterval(tickClock, 30000);
go((location.hash || '').slice(1) || 'dashboard');
</script>
