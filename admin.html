<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>if(location.hostname.endsWith('github.io'))location.replace('https://ninecafe9.netlify.app'+location.pathname.replace(/^\/cafe-nine-website/,'')+location.search+location.hash)</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة إدارة Café Nine</title>
  <style>
    :root{
      --green:#075951;--dark:#043b36;--gold:#ead8ae;--cream:#f7f4ec;--muted:#68736e;--brown:#b87558;--line:#dfe8e2;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--cream);font-family:Arial,sans-serif;color:#17211f}
    body{padding:20px}
    a{text-decoration:none;color:inherit}
    .wrap{width:min(1200px,calc(100% - 24px));margin:auto}
    .card{
      background:#fff;border-radius:20px;box-shadow:0 18px 42px rgba(4,59,54,.12);
      border:1px solid var(--line);padding:20px
    }
    .hidden{display:none!important}
    .login-box{
      width:min(420px,100%);margin:80px auto;background:#fff;border-radius:22px;
      padding:28px;border:1px solid var(--line);box-shadow:0 18px 42px rgba(4,59,54,.12)
    }
    h1,h2,h3,h4,p{margin:0}
    .title{font-size:26px;color:var(--dark);margin-bottom:10px}
    .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
    label{display:block;margin-top:14px;font-weight:700;color:var(--dark);font-size:14px}
    input,select,button,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #dfe9e3;font-size:14px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(7,89,81,.08)}
    button{background:var(--green);color:#fff;font-weight:700;border:none;cursor:pointer}
    .secondary{background:var(--brown)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
    .top-actions{display:flex;gap:10px;align-items:center}
    .top-actions button{white-space:nowrap}
    .badge{
      display:inline-block;padding:6px 10px;border-radius:999px;background:#e7f5f0;color:var(--green);font-size:12px;font-weight:700
    }
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
    .stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}
    .stat .num{font-size:28px;font-weight:800;color:var(--dark)}
    .stat .lab{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
    .box-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .orders, .menu-box{display:grid;gap:10px}
    .order-item{
      border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;
    }
    .order-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
    .order-meta{font-size:12px;color:var(--muted);}
    .item-list{margin:8px 0;padding:0;list-style:none;color:#17211f;font-size:13px}
    .item-list li{padding:4px 0;border-bottom:1px dashed #edf2ef}
    .status-select{width:auto;min-width:160px;padding:9px 12px;background:#f8faf8;border:1px solid var(--line);border-radius:10px}
    .menu-list{display:grid;gap:10px}
    .menu-row{
      border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;
      display:flex;justify-content:space-between;align-items:center;gap:10px
    }
    .menu-row .left strong{display:block;color:var(--dark)}
    .menu-row .left small{color:var(--muted)}
    .small-btn{width:auto;padding:8px 12px;font-size:12px}
    .danger{background:var(--brown)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .full{grid-column:1 / -1}
    .alert{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px}
    .alert.error{background:#fef1f1;color:#8d2b2b}
    .alert.success{background:#edf9f0;color:#1d6b46}
    .order-item.fresh{border-color:#d9b25f;box-shadow:0 0 0 3px rgba(234,216,174,.7)}
    .floor-card{margin-bottom:20px}
    .floor{position:relative;width:100%;aspect-ratio:2.2/1;min-height:260px;border-radius:16px;border:2px dashed var(--line);background:repeating-linear-gradient(45deg,#fbfaf6,#fbfaf6 12px,#f5f2ea 12px,#f5f2ea 24px);overflow:hidden;touch-action:none}
    .floor .label{position:absolute;font-size:11px;color:var(--muted);padding:6px 10px}
    .tbl{position:absolute;transform:translate(-50%,-50%);width:clamp(74px,13%,120px);aspect-ratio:1;border-radius:50%;border:3px solid #cfd8d3;background:#fff;display:grid;place-items:center;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(4,59,54,.12);user-select:none;padding:4px;transition:box-shadow .2s}
    .tbl strong{display:block;font-size:22px;color:var(--dark);line-height:1}
    .tbl span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
    .tbl.st-new{border-color:#d9a43b;background:#fff6df;animation:pulse 1.4s infinite}
    .tbl.st-confirmed{border-color:#4a7fc1;background:#eef4fc}
    .tbl.st-preparing{border-color:#d9773b;background:#fdf0e6}
    .tbl.st-ready{border-color:#2e9b63;background:#e8f7ee}
    .tbl.selected{outline:3px solid var(--green);outline-offset:3px}
    .floor.editing .tbl{cursor:grab;animation:none}
    .floor.editing{border-color:var(--green)}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,164,59,.55)}50%{box-shadow:0 0 0 12px rgba(217,164,59,0)}}
    .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
    .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid;margin-left:5px;vertical-align:-2px}
    .table-badge{display:inline-block;background:var(--dark);color:var(--gold);border-radius:999px;padding:4px 12px;font-size:14px}
    .filter-note{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#e7f5f0;color:var(--green);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
    .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:50;background:var(--dark);color:#fff;padding:14px 20px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:700;max-width:calc(100% - 32px)}
    @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)} .grid{grid-template-columns:1fr}}
    @media(max-width:500px){.stats{grid-template-columns:1fr} .form-grid{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div id="loginView" class="login-box">
    <h1 class="title">Café Nine</h1>
    <p class="sub">تسجيل الدخول إلى لوحة إدارة المقهى</p>

    <form id="loginForm">
      <label>البريد الإلكتروني
        <input id="email" type="email" required placeholder="admin@cafenine.com" />
      </label>

      <label>كلمة المرور
        <input id="password" type="password" required placeholder="••••••••" />
      </label>

      <button type="submit">تسجيل الدخول</button>
      <div id="loginError" class="alert error hidden"></div>
    </form>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <div id="adminView" class="wrap hidden">
    <div class="toolbar">
      <div>
        <h1 class="title" style="font-size:26px">لوحة إدارة Café Nine</h1>
      </div>
      <div class="top-actions">
        <button id="alertsBtn" class="small-btn" type="button">🔔 تفعيل التنبيهات</button>
        <span class="badge">Admin</span>
        <button class="secondary" id="logoutBtn" type="button">تسجيل الخروج</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div id="newCount" class="num">0</div><div class="lab">جديد</div></div>
      <div class="stat"><div id="confirmedCount" class="num">0</div><div class="lab">مؤكد</div></div>
      <div class="stat"><div id="preparingCount" class="num">0</div><div class="lab">قيد التحضير</div></div>
      <div class="stat"><div id="readyCount" class="num">0</div><div class="lab">جاهز</div></div>
      <div class="stat"><div id="deliveredCount" class="num">0</div><div class="lab">تم التسليم</div></div>
    </div>

    <div class="card floor-card">
      <div class="box-header">
        <h2>خريطة الطاولات</h2>
        <div class="top-actions">
          <button id="editFloor" type="button" class="small-btn secondary">✏️ ترتيب الطاولات</button>
        </div>
      </div>
      <div id="floor" class="floor"><div class="label">اضغط على طاولة لعرض طلباتها</div></div>
      <div class="legend">
        <span><i style="border-color:#cfd8d3"></i>فارغة</span>
        <span><i style="border-color:#d9a43b;background:#fff6df"></i>طلب جديد</span>
        <span><i style="border-color:#4a7fc1;background:#eef4fc"></i>مؤكد</span>
        <span><i style="border-color:#d9773b;background:#fdf0e6"></i>قيد التحضير</span>
        <span><i style="border-color:#2e9b63;background:#e8f7ee"></i>جاهز</span>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="box-header">
          <h2>الطلبات الواردة</h2>
          <button id="refreshOrders" type="button" class="small-btn">تحديث</button>
        </div>

        <div id="tableFilterNote" class="filter-note hidden"></div>
        <div id="ordersList" class="orders"></div>
      </div>

      <div class="card">
        <div class="box-header">
          <h2>إدارة المنيو</h2>
          <button id="refreshMenu" type="button" class="small-btn">تحديث</button>
        </div>

        <div class="menu-box">
          <div class="form-grid">
            <input id="itemArabic" type="text" placeholder="اسم الصنف بالعربي" />
            <input id="itemEnglish" type="text" placeholder="اسم الصنف بالإنجليزي" />
            <input id="itemPrice" type="number" step="0.01" placeholder="السعر" />
            <select id="itemCategory">
              <option value="frappe">فرابيه</option>
              <option value="mojito">موهيتو</option>
              <option value="smoothie">سموذي</option>
              <option value="bakery">مخبوزات</option>
              <option value="desserts">حلويات</option>
              <option value="juice">عصائر</option>
              <option value="hot">مشروبات ساخنة</option>
              <option value="cold">مشروبات باردة</option>
              <option value="tea">شاي</option>
              <option value="addons">إضافات</option>
            </select>
            <input id="itemImage" type="text" placeholder="رابط صورة الصنف (اختياري)" class="full" />
            <button id="addMenuItem" type="button" class="full">إضافة صنف</button>
          </div>
          <div id="menuList" class="menu-list" style="margin-top:14px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://esvvealfrdvfmwmyeyed.supabase.co";
    const supabaseKey = "sb_publishable_22734JdUdH_lzfoyebadsw_OlegCH9K";
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    const loginView = document.getElementById("loginView");
    const adminView = document.getElementById("adminView");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");

    function showMessage(type, text) {
      const el = document.createElement("div");
      el.className = "alert " + type;
      el.textContent = text;
      const target = document.getElementById("loginError");
      if (target) target.innerHTML = "";
      if (target) target.appendChild(el);
    }

    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        loginView.classList.add("hidden");
        adminView.classList.remove("hidden");
        await loadOrders();
        await loadMenu();
        await loadTables();
        startLiveUpdates();
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        loginError.classList.remove("hidden");
        loginError.textContent = "البريد أو كلمة المرور غير صحيحة.";
        return;
      }

      loginError.classList.add("hidden");
      loginView.classList.add("hidden");
      adminView.classList.remove("hidden");
      await loadOrders();
      await loadMenu();
      await loadTables();
      startLiveUpdates();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      stopLiveUpdates();
      lastOrderId = null;
      await db.auth.signOut();
      loginView.classList.remove("hidden");
      adminView.classList.add("hidden");
    });

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
    }

    function safeUrl(value) {
      return /^https:\/\//i.test(String(value || "")) ? escapeHtml(value) : "";
    }

    function formatMoney(value) {
      return Number(value || 0).toLocaleString("en-US") + " IQD";
    }

    // --- New-order alerts: realtime + polling fallback, desktop notification, soft chime ---
    let lastOrderId = null;
    const freshIds = new Set();
    let unseen = 0;
    const baseTitle = document.title;
    let audioCtx = null;
    let ordersChannel = null;
    let pollTimer = null;

    function unlockAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AC) audioCtx = new AC();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }
    document.addEventListener("click", unlockAudio);

    function playChime() {
      unlockAudio();
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      [[880, 0], [1318.5, 0.18]].forEach(([freq, delay]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t + delay);
        gain.gain.exponentialRampToValueAtTime(0.18, t + delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + delay + 0.6);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t + delay);
        osc.stop(t + delay + 0.65);
      });
    }

    function updateAlertsButton() {
      const btn = document.getElementById("alertsBtn");
      if (!("Notification" in window)) btn.textContent = "🔔 تنبيه صوتي فقط";
      else if (Notification.permission === "granted") btn.textContent = "🔔 التنبيهات مفعّلة";
      else if (Notification.permission === "denied") btn.textContent = "🔕 الإشعارات محظورة من المتصفح";
      else btn.textContent = "🔔 تفعيل التنبيهات";
    }

    document.getElementById("alertsBtn").addEventListener("click", async () => {
      unlockAudio();
      if ("Notification" in window && Notification.permission === "default") {
        await Notification.requestPermission();
      }
      updateAlertsButton();
      playChime();
    });
    updateAlertsButton();

    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("hidden"), 8000);
    }

    function clearUnseen() {
      unseen = 0;
      document.title = baseTitle;
    }
    window.addEventListener("focus", clearUnseen);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) clearUnseen(); });

    function notifyNewOrders(orders) {
      playChime();
      const first = orders[0];
      showToast(orders.length === 1
        ? `🔔 طلب جديد ${orderLabel(first)} — ${formatMoney(first.total)}`
        : `🔔 وصلت ${orders.length} طلبات جديدة`);
      if (document.hidden || !document.hasFocus()) {
        unseen += orders.length;
        document.title = `(${unseen}) طلب جديد — ${baseTitle}`;
      }
      if ("Notification" in window && Notification.permission === "granted") {
        orders.forEach(order => {
          const n = new Notification(order.order_type === "table" ? `🍽️ طلب طاولة ${order.table_number} — Café Nine` : "طلب جديد — Café Nine", {
            body: `${orderLabel(order)} • ${formatMoney(order.total)}`,
            tag: "order-" + order.id,
            icon: "logo.svg",
            requireInteraction: true
          });
          n.onclick = () => { window.focus(); n.close(); };
        });
      }
    }

    function startLiveUpdates() {
      stopLiveUpdates();
      ordersChannel = db.channel("orders-feed")
        .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => loadOrders())
        .subscribe();
      pollTimer = setInterval(loadOrders, 30000);
    }

    function stopLiveUpdates() {
      if (ordersChannel) db.removeChannel(ordersChannel);
      ordersChannel = null;
      clearInterval(pollTimer);
      pollTimer = null;
    }

    let allOrders = [];
    let tables = [];
    let tableFilter = null;
    let editingFloor = false;
    const ACTIVE = ["new", "confirmed", "preparing", "ready"];
    const STATUS_AR = { new: "طلب جديد", confirmed: "مؤكد", preparing: "قيد التحضير", ready: "جاهز" };

    function orderLabel(order) {
      return order.order_type === "table" ? `على طاولة ${order.table_number}` : `من ${order.customer_name || "زبون"}`;
    }

    function renderOrders() {
      const ordersList = document.getElementById("ordersList");
      const note = document.getElementById("tableFilterNote");
      const items = tableFilter === null ? allOrders : allOrders.filter(order => order.table_number === tableFilter);
      if (tableFilter === null) {
        note.classList.add("hidden");
      } else {
        note.classList.remove("hidden");
        note.innerHTML = `<span>عرض طلبات طاولة ${tableFilter} فقط</span><button type="button" class="small-btn" id="clearTableFilter">عرض كل الطلبات</button>`;
      }

      ordersList.innerHTML = items.length
        ? items.map(order => {
            const isTable = order.order_type === "table";
            return `
            <div class="order-item${freshIds.has(String(order.id)) && (order.status || "new") === "new" ? " fresh" : ""}">
              <div class="order-head">
                <div>
                  ${isTable
                    ? `<h3><span class="table-badge">🍽️ طاولة ${escapeHtml(order.table_number)}</span></h3>
                  <div class="order-meta" style="margin-top:6px;">طلب داخل الكافيه — رقم #${escapeHtml(order.id)}</div>`
                    : `<h3>${escapeHtml(order.customer_name)}</h3>
                  <div class="order-meta">${escapeHtml(order.customer_phone)} — توصيل #${escapeHtml(order.id)}</div>`}
                </div>
                <select class="status-select" data-order-id="${escapeHtml(order.id)}" data-current-status="${order.status || "new"}">
                  <option value="new" ${order.status === "new" ? "selected" : ""}>جديد</option>
                  <option value="confirmed" ${order.status === "confirmed" ? "selected" : ""}>مؤكد</option>
                  <option value="preparing" ${order.status === "preparing" ? "selected" : ""}>قيد التحضير</option>
                  <option value="ready" ${order.status === "ready" ? "selected" : ""}>جاهز</option>
                  <option value="delivered" ${order.status === "delivered" ? "selected" : ""}>تم التسليم</option>
                  <option value="cancelled" ${order.status === "cancelled" ? "selected" : ""}>ملغى</option>
                </select>
              </div>

              <div class="order-meta">
                ${new Date(order.created_at).toLocaleString("ar-IQ")}
              </div>

              ${isTable ? "" : `<div class="order-meta" style="margin-top:6px;">
                العنوان: ${escapeHtml(order.address || "غير محدد")}
              </div>`}

              ${!isTable && safeUrl(order.map_url) ? `<div class="order-meta" style="margin-top:6px;">
                <a href="${safeUrl(order.map_url)}" target="_blank" rel="noopener">فتح موقع الزبون</a>
              </div>` : ""}

              <ul class="item-list">
                ${(order.items || []).map(item => `
                  <li>
                    ${escapeHtml(item.name)} × ${escapeHtml(item.quantity)} — ${formatMoney(item.subtotal || item.unit_price * item.quantity)}
                  </li>
                `).join("")}
              </ul>

              <div class="order-meta">الإجمالي: <strong style="color:#043b36">${formatMoney(order.total)}</strong></div>
              <div class="order-meta" style="margin-top:6px;">ملاحظات: ${escapeHtml(order.notes || "لا توجد")}</div>
            </div>
          `;
          }).join("")
        : `<div class='alert error'>${tableFilter === null ? "لا توجد طلبات حتى الآن." : "لا توجد طلبات لهذه الطاولة."}</div>`;
    }

    async function loadTables() {
      const { data, error } = await db.from("cafe_tables").select("number,pos_x,pos_y").order("number");
      if (!error) tables = data || [];
      renderFloor();
    }

    function renderFloor() {
      const floor = document.getElementById("floor");
      floor.querySelectorAll(".tbl").forEach(el => el.remove());
      tables.forEach(t => {
        const active = allOrders.filter(order => order.table_number === t.number && ACTIVE.includes(order.status || "new"));
        const status = ACTIVE.find(st => active.some(order => (order.status || "new") === st));
        const sum = active.reduce((acc, order) => acc + Number(order.total || 0), 0);
        const el = document.createElement("div");
        el.className = "tbl" + (status ? " st-" + status : "") + (tableFilter === t.number ? " selected" : "");
        el.style.left = t.pos_x + "%";
        el.style.top = t.pos_y + "%";
        el.dataset.table = t.number;
        el.innerHTML = `<div><strong>${t.number}</strong><span>${status ? STATUS_AR[status] : "فارغة"}</span>${active.length ? `<span>${active.length} طلب • ${formatMoney(sum)}</span>` : ""}</div>`;
        floor.appendChild(el);
      });
    }

    // Click a table to filter, or drag tables around while editing
    (function setupFloor() {
      const floor = document.getElementById("floor");
      let drag = null;
      floor.addEventListener("pointerdown", event => {
        const el = event.target.closest(".tbl");
        if (!el) return;
        if (!editingFloor) {
          const n = Number(el.dataset.table);
          tableFilter = tableFilter === n ? null : n;
          renderOrders();
          renderFloor();
          return;
        }
        drag = el;
        el.setPointerCapture(event.pointerId);
      });
      floor.addEventListener("pointermove", event => {
        if (!drag) return;
        const box = floor.getBoundingClientRect();
        const x = Math.min(95, Math.max(5, (event.clientX - box.left) / box.width * 100));
        const y = Math.min(90, Math.max(10, (event.clientY - box.top) / box.height * 100));
        drag.style.left = x + "%";
        drag.style.top = y + "%";
        const t = tables.find(t => t.number === Number(drag.dataset.table));
        t.pos_x = Math.round(x * 10) / 10;
        t.pos_y = Math.round(y * 10) / 10;
      });
      floor.addEventListener("pointerup", () => { drag = null; });
    })();

    document.getElementById("editFloor").addEventListener("click", async () => {
      const btn = document.getElementById("editFloor");
      const floor = document.getElementById("floor");
      if (!editingFloor) {
        editingFloor = true;
        floor.classList.add("editing");
        btn.textContent = "💾 حفظ الترتيب";
        btn.classList.remove("secondary");
        return;
      }
      btn.disabled = true;
      const results = await Promise.all(tables.map(t =>
        db.from("cafe_tables").update({ pos_x: t.pos_x, pos_y: t.pos_y }).eq("number", t.number)
      ));
      btn.disabled = false;
      if (results.some(r => r.error)) {
        alert("تعذر حفظ ترتيب الطاولات.");
        return;
      }
      editingFloor = false;
      floor.classList.remove("editing");
      btn.textContent = "✏️ ترتيب الطاولات";
      btn.classList.add("secondary");
      showToast("✓ تم حفظ ترتيب الطاولات");
    });

    document.getElementById("tableFilterNote").addEventListener("click", event => {
      if (!event.target.closest("#clearTableFilter")) return;
      tableFilter = null;
      renderOrders();
      renderFloor();
    });

    async function loadOrders() {
      const { data, error } = await db
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

      const ordersList = document.getElementById("ordersList");
      if (!ordersList) return;

      if (error) {
        ordersList.innerHTML = '<div class="alert error">تعذر تحميل الطلبات.</div>';
        return;
      }

      const counts = { new: 0, confirmed: 0, preparing: 0, ready: 0, delivered: 0 };
      const items = data || [];

      const maxId = items.reduce((max, order) => Math.max(max, Number(order.id) || 0), 0);
      if (lastOrderId !== null) {
        const fresh = items.filter(order => Number(order.id) > lastOrderId && (order.status || "new") === "new");
        fresh.forEach(order => freshIds.add(String(order.id)));
        if (fresh.length) notifyNewOrders(fresh);
      }
      lastOrderId = Math.max(lastOrderId ?? 0, maxId);

      items.forEach(order => {
        counts[order.status || "new"] = (counts[order.status || "new"] || 0) + 1;
      });

      document.getElementById("newCount").textContent = counts.new || 0;
      document.getElementById("confirmedCount").textContent = counts.confirmed || 0;
      document.getElementById("preparingCount").textContent = counts.preparing || 0;
      document.getElementById("readyCount").textContent = counts.ready || 0;
      document.getElementById("deliveredCount").textContent = counts.delivered || 0;

      allOrders = items;
      renderOrders();
      renderFloor();
    }

    async function loadMenu() {
      const { data, error } = await db
        .from("menu_items")
        .select("*")
        .order("created_at", { ascending: true });

      const menuList = document.getElementById("menuList");
      if (!menuList) return;

      if (error) {
        menuList.innerHTML = '<div class="alert error">تعذر تحميل المنيو.</div>';
        return;
      }

      menuList.innerHTML = (data || []).map(item => `
        <div class="menu-row">
          <div class="left">
            <strong>${escapeHtml(item.arabic)}</strong>
            <small>${escapeHtml(item.english)} — ${formatMoney(item.price)}</small>
          </div>
          <button class="danger small-btn" data-delete-id="${escapeHtml(item.id)}" type="button">حذف</button>
        </div>
      `).join("");
    }

    document.getElementById("refreshOrders").addEventListener("click", async () => {
      await loadOrders();
    });

    document.getElementById("refreshMenu").addEventListener("click", async () => {
      await loadMenu();
    });

    document.getElementById("addMenuItem").addEventListener("click", async () => {
      const arabic = document.getElementById("itemArabic").value.trim();
      const english = document.getElementById("itemEnglish").value.trim();
      const price = Number(document.getElementById("itemPrice").value);
      const category = document.getElementById("itemCategory").value;
      const image = document.getElementById("itemImage").value.trim();

      if (!arabic || !english || !price) {
        alert("يرجى إدخال الاسم والسعر.");
        return;
      }

      const { error } = await db
        .from("menu_items")
        .insert([{ arabic, english, price, category, image }]);

      if (error) {
        alert("تعذر إضافة الصنف.");
        return;
      }

      document.getElementById("itemArabic").value = "";
      document.getElementById("itemEnglish").value = "";
      document.getElementById("itemPrice").value = "";
      document.getElementById("itemCategory").value = "frappe";
      document.getElementById("itemImage").value = "";

      await loadMenu();
    });

    document.getElementById("menuList").addEventListener("click", async (event) => {
      const target = event.target.closest("[data-delete-id]");
      if (!target) return;

      const id = target.getAttribute("data-delete-id");

      const { error } = await db
        .from("menu_items")
        .delete()
        .eq("id", id);

      if (error) {
        alert("تعذر حذف الصنف.");
        return;
      }

      await loadMenu();
    });

    document.getElementById("ordersList").addEventListener("change", async (event) => {
      const target = event.target.closest(".status-select");
      if (!target) return;

      const orderId = target.dataset.orderId;
      const newStatus = target.value;

      const { error } = await db
        .from("orders")
        .update({ status: newStatus })
        .eq("id", orderId);

      if (error) {
        alert("تعذر تحديث حالة الطلب.");
        return;
      }

      await loadOrders();
    });

    checkSession();
  </script>
</body>
</html>
