<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة إدارة Café Nine</title>
  <style>
    :root {
      --green: #075951;
      --dark: #043b36;
      --gold: #ead8ae;
      --cream: #f7f4ec;
      --muted: #68736e;
      --brown: #b87558;
      --line: rgba(7,89,81,.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--cream);
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(440px, calc(100% - 28px));
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 18px 42px rgba(4,59,54,.12);
    }

    .panel {
      width: min(920px, calc(100% - 28px));
      display: none;
    }

    h1, h2, h3 {
      margin: 0 0 10px;
      color: var(--dark);
      font-family: "Tahoma", sans-serif;
    }

    p {
      margin: 0;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 700;
      color: var(--dark);
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      margin-top: 8px;
      padding: 12px 13px;
      border-radius: 12px;
      border: 1px solid #dfe9e3;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(7,89,81,.08);
    }

    button {
      background: var(--green);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .error {
      margin-top: 12px;
      color: var(--brown);
      font-size: 13px;
      text-align: center;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .logout {
      width: auto;
      padding: 10px 16px;
      background: var(--brown);
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      background: #fff;
    }

    .small-btn {
      width: auto;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 12px;
    }

    .menu-list {
      margin-top: 14px;
      display: grid;
      gap: 12px;
    }

    .menu-row {
      border-bottom: 1px solid #edf2ef;
      padding-bottom: 10px;
    }

    .menu-row strong {
      color: var(--dark);
    }

    .delete-btn {
      width: auto;
      padding: 7px 12px;
      background: var(--brown);
      margin-top: 8px;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div id="loginView" class="card">
    <h1>Café Nine</h1>
    <p>تسجيل الدخول إلى لوحة الإدارة</p>

    <form id="loginForm">
      <label>
        البريد الإلكتروني
        <input id="email" type="email" placeholder="admin@cafenine.com" required />
      </label>

      <label>
        كلمة المرور
        <input id="password" type="password" placeholder="••••••••" required />
      </label>

      <button type="submit">تسجيل الدخول</button>

      <div id="loginError" class="error"></div>
    </form>
  </div>

  <div id="adminView" class="card panel">
    <div class="toolbar">
      <h2>لوحة إدارة Café Nine</h2>
      <button class="logout" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <div class="grid">
      <div class="box">
        <h3>إضافة صنف</h3>
        <input id="arabic" type="text" placeholder="اسم الصنف بالعربي" />
        <input id="english" type="text" placeholder="اسم الصنف بالإنجليزي" />
        <input id="price" type="text" placeholder="السعر: 5000" />
        <select id="category">
          <option value="frappe">فرابيه</option>
          <option value="mojito">موهيتو</option>
          <option value="smoothie">سموذي</option>
          <option value="bakery">مخبوزات</option>
          <option value="desserts">حلويات</option>
          <option value="juice">عصائر</option>
          <option value="hot">مشروبات ساخنة</option>
          <option value="cold">مشروبات باردة</option>
          <option value="tea">شاي</option>
          <option value="addons">إضافات</option>
        </select>
        <button type="button" class="small-btn" id="addItemBtn">إضافة صنف</button>
      </div>

      <div class="box">
        <h3>المنيو الحالي</h3>
        <button type="button" class="small-btn" id="refreshBtn">تحديث المنيو</button>
        <div id="menuList" class="menu-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://esvvealfrdvfmwmyeyed.supabase.co";
    const supabaseKey = "sb_publishable_22734JdUdH_lzfoyebadsw_OlegCH9K";
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const loginView = document.getElementById("loginView");
    const adminView = document.getElementById("adminView");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");

    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        loginView.style.display = "none";
        adminView.style.display = "block";
        loadMenu();
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        loginError.textContent = "البريد أو كلمة المرور غير صحيحة.";
        return;
      }

      loginError.textContent = "";
      loginView.style.display = "none";
      adminView.style.display = "block";
      loadMenu();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      loginView.style.display = "block";
      adminView.style.display = "none";
    });

    async function loadMenu() {
      const { data, error } = await supabase
        .from("menu_items")
        .select("*")
        .order("created_at", { ascending: true });

      const list = document.getElementById("menuList");
      if (!list) return;

      if (error) {
        list.innerHTML = "<p>تعذر تحميل المنيو.</p>";
        return;
      }

      list.innerHTML = (data || []).map(item => `
        <div class="menu-row">
          <strong>${item.arabic}</strong> - ${item.english}<br>
          <span>${item.price} IQD</span><br>
          <button type="button" class="delete-btn" data-delete="${item.id}">حذف</button>
        </div>
      `).join("");
    }

    document.getElementById("addItemBtn").addEventListener("click", async () => {
      const arabic = document.getElementById("arabic").value.trim();
      const english = document.getElementById("english").value.trim();
      const price = document.getElementById("price").value.trim();
      const category = document.getElementById("category").value;

      if (!arabic || !english || !price) {
        alert("يرجى إدخال جميع الحقول.");
        return;
      }

      const { error } = await supabase.from("menu_items").insert([
        { category, arabic, english, price }
      ]);

      if (error) {
        alert("تعذر إضافة الصنف.");
        return;
      }

      document.getElementById("arabic").value = "";
      document.getElementById("english").value = "";
      document.getElementById("price").value = "";

      loadMenu();
    });

    document.getElementById("menuList").addEventListener("click", async (event) => {
      const btn = event.target.closest("[data-delete]");
      if (!btn) return;

      const id = btn.dataset.delete;

      const { error } = await supabase
        .from("menu_items")
        .delete()
        .eq("id", id);

      if (!error) {
        loadMenu();
      }
    });

    document.getElementById("refreshBtn").addEventListener("click", loadMenu);

    checkSession();
  </script>
</body>
</html>
