<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة Café Nine</title><style>body{margin:0;background:#f7f4ec;font-family:Arial;color:#17211f}.card{width:min(1000px,calc(100% - 28px));margin:30px auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 35px #043b3615}input,select,button{width:100%;padding:11px;margin:6px 0;border:1px solid #dfe8e2;border-radius:10px;box-sizing:border-box}button{background:#075951;color:#fff;border:0;cursor:pointer;font-weight:bold}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{border:1px solid #dfe8e2;border-radius:15px;padding:16px}.row{border-bottom:1px solid #edf2ef;padding:12px 0}.danger{background:#b87558;width:auto;padding:7px 12px}.status{padding:5px;border-radius:8px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="card"><h1>Café Nine</h1><p>تسجيل الدخول إلى لوحة الإدارة</p><form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button>تسجيل الدخول</button><p id="loginError"></p></form></div>
<div id="panel" class="card hidden"><div style="display:flex;justify-content:space-between;align-items:center"><h1>لوحة الإدارة</h1><button id="logout" style="width:auto;background:#b87558">خروج</button></div><div class="grid"><div class="box"><h2>الطلبات الواردة</h2><button id="refreshOrders">تحديث الطلبات</button><div id="orders"></div></div><div class="box"><h2>إضافة صنف</h2><input id="arabic" placeholder="اسم الصنف بالعربي"><input id="english" placeholder="الاسم بالإنجليزي"><input id="price" placeholder="السعر"><select id="category"><option value="frappe">فرابيه</option><option value="mojito">موهيتو</option><option value="smoothie">سموثي</option><option value="bakery">مخبوزات</option><option value="desserts">حلويات</option><option value="juice">عصائر</option><option value="hot">ساخنة</option><option value="cold">باردة</option><option value="tea">شاي</option><option value="addons">إضافات</option></select><input id="image" placeholder="رابط الصورة اختياري"><button id="addItem">إضافة الصنف</button><h2>الأصناف</h2><div id="menu"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://esvvealfrdvfmwmyeyed.supabase.co','sb_publishable_22734JdUdH_lzfoyebadsw_OlegCH9K');const $=s=>document.querySelector(s);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(){('#login');$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');loadOrders();loadMenu()}async function loadOrders(){const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});$('#orders').innerHTML=error?'<p>شغّل orders-schema.sql أولًا.</p>':(data||[]).map(o=>`<div class="row"><b>${esc(o.customer_name)} — ${esc(o.customer_phone)}</b><br><small>${new Date(o.created_at).toLocaleString('ar-IQ')}</small><p>${esc(o.address)}</p><p>${(o.items||[]).map(x=>`${esc(x.name)} × ${x.quantity}`).join('، ')}</p><b>${Number(o.total).toLocaleString()} IQD</b><select data-status="${o.id}"><option value="new" ${o.status==='new'?'selected':''}>جديد</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>مؤكد</option><option value="preparing" ${o.status==='preparing'?'selected':''}>قيد التحضير</option><option value="ready" ${o.status==='ready'?'selected':''}>جاهز</option><option value="delivered" ${o.status==='delivered'?'selected':''}>تم التسليم</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>ملغى</option></select>${o.map_url?`<a href="${esc(o.map_url)}" target="_blank">📍 فتح موقع الزبون</a>`:''}</div>`).join('')||'<p>لا توجد طلبات.</p>'}async function loadMenu(){const {data}=await db.from('menu_items').select('*').order('created_at',{ascending:true});$('#menu').innerHTML=(data||[]).map(x=>`<div class="row"><b>${esc(x.arabic)}</b> — ${Number(x.price).toLocaleString()} IQD<br><button class="danger" data-delete="${x.id}">حذف</button></div>`).join('')}$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)return $('#loginError').textContent='بيانات الدخول غير صحيحة';show()});$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('#refreshOrders').onclick=loadOrders;$('#orders').addEventListener('change',async e=>{if(e.target.dataset.status)await db.from('orders').update({status:e.target.value}).eq('id',e.target.dataset.status)});$('#addItem').onclick=async()=>{const payload={arabic:$('#arabic').value.trim(),english:$('#english').value.trim(),price:$('#price').value.trim(),category:$('#category').value,image:$('#image').value.trim()||null};if(!payload.arabic||!payload.english||!payload.price)return alert('أكمل البيانات');const {error}=await db.from('menu_items').insert(payload);if(error)return alert('تعذر إضافة الصنف');['arabic','english','price','image'].forEach(id=>$('#'+id).value='');loadMenu()};$('#menu').addEventListener('click',async e=>{if(e.target.dataset.delete){await db.from('menu_items').delete().eq('id',e.target.dataset.delete);loadMenu()}});db.auth.getSession().then(({data})=>{if(data.session)show()});</script></body></html>
